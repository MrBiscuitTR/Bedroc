# =============================================================================
# docker-compose.yml — Bedroc self-contained stack (frontend + API + TLS proxy)
# =============================================================================
#
# For a private server reached over WireGuard / Tailscale / LAN. nginx
# terminates TLS and listens ONLY on BIND_IP (default 10.66.66.1, the
# WireGuard interface), so nothing is exposed on the public internet.
#
# Manage it with the helper script (recommended — adds safety checks, backups):
#   bash bedroc.sh setup      # first time: creates .env with fresh secrets + cert
#   bash bedroc.sh up         # start / apply changes
#   bash bedroc.sh update     # after `git pull`: backup → rebuild → restart
#
# Or directly:  docker compose --env-file .env up -d --build
#
# Hardening (every container): no-new-privileges, ALL capabilities dropped
# (a few added back only where an official entrypoint needs them), read-only
# root filesystem, process limits, bounded logs. Database, cache, API and the
# static frontend sit on internal networks with no internet access; only nginx
# publishes ports. Migrations run in a short-lived container so the API server
# never holds the PostgreSQL superuser password.
#
# DO NOT rename the services or the `postgres_data` volume — that volume holds
# your existing data.
# =============================================================================

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    <<: *hardening
    build:
      context: ./docker/postgres
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    shm_size: 128mb
    pids_limit: 256
    environment:
      POSTGRES_DB: bedroc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in your env file}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is not set in your env file}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bedroc"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ── Redis 7 (password-protected, memory only) ───────────────────────────────
  redis:
    <<: *hardening
    image: redis:7.4-alpine
    user: redis
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777
    pids_limit: 64
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is not set in your env file — run "bash bedroc.sh check" to add one}
    command:
      - sh
      - -c
      - |
        umask 077
        {
          printf 'requirepass %s\n' "$$REDIS_PASSWORD"
          printf 'save ""\nappendonly no\nprotected-mode yes\nloglevel warning\n'
          printf 'rename-command CONFIG ""\nrename-command DEBUG ""\nrename-command MODULE ""\n'
          printf 'rename-command REPLICAOF ""\nrename-command SLAVEOF ""\n'
        } > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── One-shot database migrations ────────────────────────────────────────────
  migrate:
    <<: *hardening
    restart: "no"
    build:
      context: ./server
    entrypoint: ["node", "dist/migrate.js"]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/bedroc
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  # ── Fastify API server ──────────────────────────────────────────────────────
  server:
    <<: *hardening
    build:
      context: ./server
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      RUN_MIGRATIONS: "false"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is not set in your env file}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is not set in your env file}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-30d}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be set in your env file (see .env.example)}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      RECORD_LOGIN_IP: ${RECORD_LOGIN_IP:-true}
      ENABLE_ACCESS_LOG: "false"
    networks:
      - backend
      - web
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── SvelteKit frontend (static files, unprivileged nginx) ───────────────────
  bedroc:
    <<: *hardening
    build:
      context: ./bedroc
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 64
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── nginx (TLS termination, bound to BIND_IP only) ──────────────────────────
  nginx:
    <<: *hardening
    build:
      context: ./docker/nginx
    # Master process: read the TLS key (any host ownership), bind 80/443 in the
    # container, start workers as the nginx user.
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID, NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run
      - /tmp
    pids_limit: 64
    volumes:
      # TLS certificate + key — see GUIDE.md ("bash bedroc.sh setup" can create a self-signed one)
      - ./docker/ssl:/etc/nginx/ssl:ro
    ports:
      # Bound ONLY to BIND_IP (your WireGuard/Tailscale/LAN address).
      # Never use 0.0.0.0 unless you really mean "the whole internet".
      - "${BIND_IP:-10.66.66.1}:${HTTP_PORT:-80}:80"
      - "${BIND_IP:-10.66.66.1}:${HTTPS_PORT:-443}:443"
    networks:
      - web
      - edge
    depends_on:
      server:
        condition: service_healthy
      bedroc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ── Adminer (optional DB GUI — NOT started by default) ──────────────────────
  # bash bedroc.sh admin start   → http://${BIND_IP}:${ADMINER_PORT:-8080}
  # bash bedroc.sh admin stop
  adminer:
    <<: *hardening
    restart: "no"
    profiles: ["admin"]
    image: adminer:5.4.1
    read_only: true
    tmpfs:
      - /tmp
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${BIND_IP:-10.66.66.1}:${ADMINER_PORT:-8080}:8080"
    networks:
      - backend
      - edge
    depends_on:
      - postgres

networks:
  backend:
    internal: true     # postgres, redis, migrate, server — no internet access
  web:
    internal: true     # nginx ↔ frontend ↔ API
  edge: {}             # only for publishing nginx's (and Adminer's) ports

volumes:
  postgres_data:
    # All user data. Back up with `bash bedroc.sh backup`.
