name: Build Desktop Apps

# Builds the Electron app for Windows, macOS and Linux on GitHub's runners and
# uploads the installers as workflow artifacts (no release is published here).
#
#   - Manually: Actions → "Build Desktop Apps" → Run workflow (any branch)
#   - On a pushed v* tag
#   - Called by release.yml, which then publishes a GitHub Release
#
# Security: read-only token, no secrets, every action pinned to a commit SHA,
# installs strictly from the committed lockfiles (npm ci).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag/branch/SHA) to build
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            script: dist:win
            files: |
              desktop/dist/*.exe
          - name: macos
            os: macos-latest
            script: dist:mac
            files: |
              desktop/dist/*.dmg
              desktop/dist/*.zip
          - name: linux
            os: ubuntu-latest
            script: dist:linux
            files: |
              desktop/dist/*.AppImage
              desktop/dist/*.deb
              desktop/dist/*.rpm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install rpm tooling
        if: matrix.name == 'linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q rpm

      - name: Build frontend
        working-directory: bedroc
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      # Electron's own postinstall downloads the Electron binary, so scripts stay on here.
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Fix app-builder permissions (Linux)
        if: matrix.name == 'linux'
        working-directory: desktop
        run: |
          if [ -f node_modules/app-builder-bin/linux/x64/app-builder ]; then
            chmod +x node_modules/app-builder-bin/linux/x64/app-builder
          fi

      - name: Build installers
        working-directory: desktop
        # --publish never: this job only builds; release.yml publishes.
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          # No Apple Developer certificate: build unsigned (users right-click → Open once).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
